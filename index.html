<!doctype html>
<html lang="es" data-tema="oscuro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Al Día</title>
<meta name="description" content="Tus cuentas, tus deudas y tus pagos, al día.">
<meta name="theme-color" content="#121417">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23121417'/%3E%3Crect x='20' y='25' width='60' height='55' rx='10' fill='%233DDC84'/%3E%3Crect x='26' y='40' width='48' height='34' rx='5' fill='%23121417'/%3E%3Crect x='32' y='17' width='7' height='16' rx='3.5' fill='%23E9FBF1'/%3E%3Crect x='61' y='17' width='7' height='16' rx='3.5' fill='%23E9FBF1'/%3E%3Cpath d='M36 57L46 66L65 47' fill='none' stroke='%233DDC84' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#121417;--sf:#1a1d22;--sf2:#23272e;--ln:#2e333b;--tx:#eceff3;--mu:#a3acb7;--ac:#3ddc84;--ac-tx:#062112;--ac-soft:rgba(61,220,132,.14);--neg:#ff8f87;--neg-soft:rgba(255,143,135,.14);--warn:#f5b84b;--warn-soft:rgba(245,184,75,.14);--r:16px;--sombra:0 8px 30px rgba(0,0,0,.45)}
[data-tema=claro]{--bg:#f3f5f6;--sf:#fff;--sf2:#eaeef0;--ln:#d9dee2;--tx:#14181d;--mu:#56606b;--ac:#11834a;--ac-tx:#fff;--ac-soft:rgba(17,131,74,.1);--neg:#b93a2f;--neg-soft:rgba(185,58,47,.1);--warn:#8f5b00;--warn-soft:rgba(143,91,0,.1);--sombra:0 8px 30px rgba(0,0,0,.18)}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{font-family:Barlow,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx);font-size:16px;line-height:1.4;min-height:100vh;padding-bottom:calc(92px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent;overflow-wrap:anywhere}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
svg{flex:none}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:2px;padding:6px 6px 6px 14px;padding-top:calc(6px + env(safe-area-inset-top));background:var(--bg);border-bottom:1px solid var(--ln)}
.top-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:2px;width:100%}
.marca{flex:1;display:flex;align-items:center;gap:8px;font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:700;font-size:23px;letter-spacing:.2px;min-width:0}
.marca svg{width:30px;height:30px}
.marca b{color:var(--ac)}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--mu)}
.ib:active{background:var(--sf2)}
.ib svg{width:22px;height:22px}
main{max-width:560px;margin:0 auto;padding:14px 16px}
.tab[hidden]{display:none}
.tab{animation:entra .18s ease-out}
@keyframes entra{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
h1{font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:700;font-size:27px;line-height:1.1;margin:2px 0 12px}
h2{font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:700;font-size:21px;line-height:1.15}
h3{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--mu);margin:2px 0 8px}
p{margin:0 0 8px}
small,.mu{color:var(--mu);font-size:13px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:14px;margin-bottom:12px}
.hero small{font-size:14px}
.hero .total{display:block;font-family:"Barlow Condensed",Barlow,sans-serif;font-size:40px;font-weight:700;line-height:1.1;margin:2px 0 6px}
.m{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.m.neg,.neg{color:var(--neg)}
.m.pos{color:var(--ac)}
.privado .m{filter:blur(8px);user-select:none}
.fila,.mv{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:8px 0;border-top:1px solid var(--ln);text-align:left}
.lista>.fila:first-child,.lista>.mv:first-child,.lista>.dia+.mv{border-top:0}
button.fila:active,.mv:active{background:var(--sf2)}
.ico{width:38px;height:38px;border-radius:50%;background:var(--sf2);display:grid;place-items:center;color:var(--mu)}
.ico svg{width:20px;height:20px}
.ico.in{color:var(--ac);background:var(--ac-soft)}
.ico.out{color:var(--neg);background:var(--neg-soft)}
.fx{flex:1;min-width:0}
.fx b{display:block;font-weight:600;line-height:1.25}
.fx small{display:block;line-height:1.3;margin-top:2px}
.der{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.mini{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:12px 14px;text-align:left;min-height:96px;display:flex;flex-direction:column;justify-content:space-between;gap:4px}
.mini .m{font-family:"Barlow Condensed",Barlow,sans-serif;font-size:25px;font-weight:700;white-space:normal}
.bt{min-height:48px;padding:0 18px;border-radius:14px;background:var(--ac);color:var(--ac-tx);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;line-height:1.2}
.bt:active{transform:scale(.98)}
.bt svg{width:20px;height:20px}
.bt.sm{min-height:44px;padding:0 14px;font-size:15px;border-radius:12px}
.bt.ghost{background:transparent;color:var(--tx);border:1px solid var(--ln)}
.bt.sec{background:var(--sf2);color:var(--tx)}
.bt.full{width:100%}
.bt.ghost.neg{color:var(--neg)}
.bt[disabled]{opacity:.45;pointer-events:none}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.btns>.bt{flex:1 1 140px}
.enlace{color:var(--ac);font-weight:600;min-height:44px;min-width:44px;padding:0 4px;display:inline-flex;align-items:center;justify-content:center;text-decoration:underline;text-underline-offset:3px}
.aviso{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:14px;margin-bottom:10px;background:var(--sf);border:1px solid var(--ln);border-left:4px solid var(--ac)}
.aviso.warn{border-left-color:var(--warn)}
.aviso.mal{border-left-color:var(--neg)}
.av-tx{display:flex;gap:10px;align-items:flex-start}
.av-tx svg{width:20px;height:20px;margin-top:1px;color:var(--mu)}
.aviso.warn .av-tx svg{color:var(--warn)}
.aviso.mal .av-tx svg{color:var(--neg)}
.av-tx p{margin:0}
.av-bt{display:flex;gap:8px;flex-wrap:wrap}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:3px 8px;border-radius:10px;background:var(--sf2);color:var(--mu);white-space:nowrap}
.b-vencido{background:var(--neg-soft);color:var(--neg)}
.b-hoy,.b-parcial{background:var(--warn-soft);color:var(--warn)}
.b-pagado{background:var(--ac-soft);color:var(--ac)}
.barra{height:8px;background:var(--sf2);border-radius:4px;overflow:hidden;margin:10px 0 6px}
.barra i{display:block;height:100%;background:var(--ac);border-radius:4px;transition:width .4s ease}
.deuda .d-top{display:flex;align-items:center;gap:12px}
.d-datos{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px}
details.sec{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);margin-bottom:12px}
details.sec>summary{min-height:56px;display:flex;align-items:center;gap:10px;padding:8px 14px;list-style:none;cursor:pointer;font-weight:600}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary .fx small{font-weight:400}
details.sec>summary .chev{transition:transform .2s;color:var(--mu)}
details.sec[open]>summary .chev{transform:rotate(180deg)}
.sec-in{padding:0 14px 14px}
.dia{font-size:13px;font-weight:600;color:var(--mu);padding:12px 0 4px;text-transform:capitalize}
.filtros{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 12px}
.in,select.in{width:100%;min-height:48px;padding:10px 12px;border-radius:12px;border:1px solid var(--ln);background:var(--sf2);color:var(--tx)}
.buscar{position:relative}
.buscar svg{position:absolute;left:12px;top:14px;width:20px;height:20px;color:var(--mu)}
.buscar .in{padding-left:40px}
.lbl{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
.lbl small{font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:6px 14px;border-radius:22px;border:1px solid var(--ln);background:var(--sf2);font-size:15px;line-height:1.2;text-align:left;display:inline-flex;align-items:center;gap:6px;max-width:100%}
.chip.on{background:var(--ac);border-color:var(--ac);color:var(--ac-tx);font-weight:600}
.chip small{color:inherit;opacity:.8}
.chip[disabled]{opacity:.45;pointer-events:none}
.chip .x{min-width:44px;min-height:44px;margin:-6px -14px -6px -4px;border-radius:0 22px 22px 0;color:var(--mu);font-size:20px;line-height:1}
.chip .x:active{background:var(--ln)}
.grupo{font-size:12px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.5px;margin:8px 0 6px;width:100%}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--sf2);padding:4px;border-radius:14px}
.seg button{min-height:44px;border-radius:10px;font-weight:600;font-size:15px;color:var(--mu);line-height:1.15;padding:0 4px}
.seg button.on{background:var(--sf);color:var(--tx);box-shadow:0 1px 4px rgba(0,0,0,.25)}
.monto{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--ln);padding:4px 2px}
.monto:focus-within{border-bottom-color:var(--ac)}
.monto span{font-family:"Barlow Condensed",Barlow,sans-serif;font-size:28px;color:var(--mu);font-weight:700}
.monto input{flex:1;min-width:0;width:100%;background:transparent;border:0;outline:0;font-family:"Barlow Condensed",Barlow,sans-serif;font-size:38px;font-weight:700;padding:0;min-height:48px}
.monto.sm span{font-size:20px}
.monto.sm input{font-size:26px;min-height:44px}
.msg{padding:10px 12px;border-radius:12px;background:var(--warn-soft);color:var(--warn);margin-top:12px;font-weight:500}
.msg.err{background:var(--neg-soft);color:var(--neg)}
.chk{display:flex;align-items:center;gap:10px;min-height:48px;margin-top:6px;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--ac)}
.vacio{text-align:center;padding:28px 12px}
.vacio p{color:var(--mu)}
.vacio .bt{margin-top:8px}
.mesnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.mesnav h1{margin:0;text-align:center;flex:1}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;height:68px}
.nb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:64px;color:var(--mu);font-family:"Barlow Condensed",Barlow,sans-serif;font-size:13px;font-weight:600;letter-spacing:.2px}
.nb svg{width:24px;height:24px}
.nb.on{color:var(--ac)}
.fab{justify-self:center;width:60px;height:60px;border-radius:50%;background:var(--ac);color:var(--ac-tx);display:grid;place-items:center;transform:translateY(-14px);box-shadow:0 6px 18px rgba(0,0,0,.35)}
.fab svg{width:30px;height:30px;stroke-width:2.6}
.fab:active{transform:translateY(-14px) scale(.95)}
#velo{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:61;animation:fade .15s}
@keyframes fade{from{opacity:0}}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:62;max-width:560px;margin:0 auto;max-height:92vh;max-height:92dvh;overflow:auto;overscroll-behavior:contain;background:var(--sf);border-radius:22px 22px 0 0;box-shadow:var(--sombra);padding-bottom:calc(16px + env(safe-area-inset-bottom));animation:sube .22s cubic-bezier(.2,.8,.3,1)}
@keyframes sube{from{transform:translateY(40px);opacity:0}}
.sh-head{position:sticky;top:0;z-index:2;background:var(--sf);display:flex;align-items:center;gap:8px;padding:10px 8px 6px 18px;border-bottom:1px solid var(--ln)}
.sh-head h2{flex:1}
.sh-body{padding:4px 18px 8px}
.sh-body>p:first-child{margin-top:12px}
.ayuda h3{margin-top:16px}
.ayuda p,.ayuda li{color:var(--tx);font-size:15px}
.ayuda ul{padding-left:20px;margin-bottom:8px}
#toast{position:fixed;left:16px;right:16px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:65;max-width:528px;margin:0 auto;background:var(--tx);color:var(--bg);border-radius:14px;padding:6px 8px 6px 16px;display:flex;align-items:center;gap:8px;box-shadow:var(--sombra);animation:sube .2s}
#toast p{flex:1;margin:0;font-weight:500}
#toast{pointer-events:none}
#toast button{pointer-events:auto}
#toast button{min-height:44px;padding:0 12px;font-weight:700;color:var(--bg);text-decoration:underline;text-underline-offset:3px}
#upd{position:fixed;left:16px;right:16px;top:calc(64px + env(safe-area-inset-top));z-index:35;max-width:528px;margin:0 auto;background:var(--ac);color:var(--ac-tx);border-radius:14px;padding:4px 6px 4px 16px;display:flex;align-items:center;gap:8px;font-weight:600;box-shadow:var(--sombra)}
#upd p{flex:1;margin:0}
#upd button{min-height:44px;padding:0 14px;font-weight:700;color:var(--ac-tx);text-decoration:underline}
#bienv{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto;display:flex;flex-direction:column}
.bv{max-width:480px;margin:0 auto;padding:calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;min-height:100%;width:100%}
.bv-top{display:flex;justify-content:flex-end;min-height:44px}
.bv-mid{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:12px;padding:24px 0}
.bv-mid svg.logo{width:112px;height:112px}
.bv-mid h1{font-size:34px;margin:8px 0 0;text-transform:uppercase;letter-spacing:.5px}
.bv-mid p{color:var(--mu);font-size:17px;max-width:360px}
.bv-bt{display:flex;flex-direction:column;gap:10px}
.archivo{position:relative;overflow:hidden}
.archivo input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
#tour{position:fixed;inset:0;z-index:70}
#tour .spot{position:fixed;border-radius:14px;box-shadow:0 0 0 2px var(--ac),0 0 0 9999px rgba(0,0,0,.66);transition:all .25s ease;pointer-events:none}
#tour .tcard{position:fixed;left:16px;right:16px;max-width:480px;margin:0 auto;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:14px 16px;box-shadow:var(--sombra);max-height:46vh;overflow:auto}
#tour .tcard h2{margin-bottom:4px}
#tour .tcard .paso{font-size:13px;color:var(--mu)}
#tour .tbt{display:flex;gap:8px;margin-top:10px;align-items:center}
#tour .tbt .bt{flex:1}
.cq{padding:12px 0;border-top:1px solid var(--ln)}
.cq:first-of-type{border-top:0}
.cq-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.cq-dif{display:block;margin-top:4px;min-height:18px}
.cq-h{margin:20px 0 6px}
.cq-p{margin:0 0 4px}
.acerca{font-size:13px;color:var(--mu)}
@media (min-width:700px){body{padding-bottom:110px}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="marca"><svg class="logo" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="22" fill="#121417"/><rect x="20" y="25" width="60" height="55" rx="10" fill="#3DDC84"/><rect x="26" y="40" width="48" height="34" rx="5" fill="#121417"/><rect x="32" y="17" width="7" height="16" rx="3.5" fill="#E9FBF1"/><rect x="61" y="17" width="7" height="16" rx="3.5" fill="#E9FBF1"/><path d="M36 57L46 66L65 47" fill="none" stroke="#3DDC84" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Al <b>Día</b></span></div>
  <button class="ib" id="b-ojo" data-act="ocultar" aria-label="Ocultar montos"></button>
  <button class="ib" id="b-ayuda" data-act="ayuda" aria-label="¿Cómo funciona?"></button>
  <button class="ib" id="b-ajustes" data-act="ir" data-arg="ajustes" aria-label="Ajustes"></button>
</div></header>
<main>
  <section class="tab" id="t-inicio"></section>
  <section class="tab" id="t-movs" hidden></section>
  <section class="tab" id="t-pagos" hidden></section>
  <section class="tab" id="t-deudas" hidden></section>
  <section class="tab" id="t-ajustes" hidden></section>
</main>
<nav class="tabs" aria-label="Secciones"><div class="tabs-in">
  <button class="nb" data-act="ir" data-arg="inicio"></button>
  <button class="nb" data-act="ir" data-arg="movs"></button>
  <button class="fab" data-act="registrar" aria-label="Registrar un movimiento"></button>
  <button class="nb" data-act="ir" data-arg="pagos"></button>
  <button class="nb" data-act="ir" data-arg="deudas"></button>
</div></nav>
<div id="velo" data-act="cerrar" hidden></div>
<div id="sheet" role="dialog" aria-modal="true" hidden></div>
<div id="toast" role="status" hidden></div>
<div id="upd" hidden><p>Hay una versión nueva</p><button data-act="actualizar">Actualizar</button></div>
<div id="bienv" hidden></div>
<div id="tour" hidden></div>
<script>
"use strict";
/* =====================================================================================================
   Al Día — app personal de finanzas. Un solo archivo, sin dependencias.
   Los datos viven en localStorage (claves aldia.*.v1), solo en este dispositivo; el respaldo es un archivo.
   La lógica pura va primero (scripts/validar.js la ejecuta en un vm, sin navegador); la interfaz después.
   Dinero en CENTAVOS enteros. Fechas locales AAAA-MM-DD.
   ===================================================================================================== */

const K = { cuentas: "aldia.cuentas.v1", movs: "aldia.movs.v1", fijos: "aldia.fijos.v1", cats: "aldia.cats.v1", plantillas: "aldia.plantillas.v1", aj: "aldia.ajustes.v1", respaldo: "aldia.respaldo.v1", avisos: "aldia.avisos.v1", recorrido: "aldia.recorrido.v1", bienvenida: "aldia.bienvenida.v1", previo: "aldia.previo.v1", danados: "aldia.danados.v1" };
const CLASES = { tengo: "Tengo", debo: "Debo", meDeben: "Me deben" };
const TIPOS = { tengo: [["banco", "Banco"], ["billetera", "Billetera digital"], ["efectivo", "Efectivo"]], debo: [["tarjeta", "Tarjeta de crédito"], ["credito", "Crédito o préstamo"], ["persona", "Persona"]], meDeben: [["persona", "Persona"]] };
const TIPOS_MOV = ["gasto", "ingreso", "traslado", "ajuste"];
const CAT_AJUSTE = "Ajuste de cuadre", CAT_FIJOS = "Gastos fijos", CAT_INTERES = "Intereses y comisiones";
const CATS_BASE = {
  gasto: ["Alimentación - Mercado", "Alimentación - Restaurantes/Antojos", "Transporte / Gasolina", "Mantenimiento Vehículo/Moto", "Salud y Cuidado Personal", "Ocio y Entretenimiento", "Ropa y Calzado", "Hogar / Aseo", "Ayudas / Regalos", "Mascotas", "Educación / Cursos", "Tecnología", "Imprevistos / Otros Gastos", CAT_FIJOS, CAT_INTERES],
  ingreso: ["Sueldo / Nómina", "Honorarios / Trabajos Extra", "Ingresos por Préstamos", "Retorno de Préstamos", "Regalos / Ayudas", "Venta de Artículos", "Devoluciones / Reembolsos", "Rendimientos Financieros", "Otros Ingresos"],
};
const AJ_BASE = { tema: "oscuro", ocultar: false, ultimaCuenta: null, cuadres: {} };
const MESES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
const DSEM = ["dom", "lun", "mar", "mié", "jue", "vie", "sáb"];

/* ---------- Fechas (siempre se calculan en el momento: la app puede quedar abierta de un día para otro) ---------- */

let DB = sanear({}).db;

/* ---------- Cálculos ---------- */

function saldo(id, hasta) {

  for (const m of DB.movs) { if (m.borrado || (hasta && m.fecha > hasta)) continue; s += efecto(m, id); }

}
function saldos(hasta) {

    if (m.borrado || (hasta && m.fecha > hasta)) continue;
    if (m.hacia != null && m.hacia in s) s[m.hacia] += m.valor;

function totales(S) { S = S || saldos(); const t = { tengo: 0, debo: 0, meDeben: 0 }; for (const c of DB.cuentas) t[c.clase] += S[c.id]; return t; }

// Un monto que se sale de lo normal pide un segundo toque (¿sobra un cero?). Nunca bloquea.

// Crea o actualiza un movimiento con los datos del formulario. Devuelve { mov, antes } (antes = copia previa si se editó).

// Cuadre: compara el saldo real con el de la app y crea un ajuste a la vista por la diferencia.

  if (!o || o.app !== "aldia" || !Array.isArray(o.movs) || !Array.isArray(o.cuentas)) return { error: "El archivo no es un respaldo de Al Día." };
  const r = sanear(o);
  return { db: r.db, fuera: r.fuera, creado: typeof o.creado === "string" ? o.creado : null, nota: typeof o.nota === "string" ? o.nota : "" };
}
function resumenDB(db) { const v = db.movs.filter((m) => !m.borrado), f = v.map((m) => m.fecha).sort(); return { cuentas: db.cuentas.length, movs: v.length, desde: f[0] || null, hasta: f[f.length - 1] || null }; }
function compararRespaldo(actual, nuevo) {
  const a = resumenDB(actual), n = resumenDB(nuevo), out = [];
  if (a.movs > n.movs) out.push("Aquí tienes " + a.movs + " movimientos y el respaldo trae " + n.movs + ": perderías " + (a.movs - n.movs) + ".");
  if (a.hasta && n.hasta && n.hasta < a.hasta) out.push("El respaldo llega hasta el " + fechaCorta(n.hasta) + " y aquí tienes datos hasta el " + fechaCorta(a.hasta) + ".");
  return out;
}

function textoMov(m) { return [m.nota, m.cat, m.desde && nombreCuenta(m.desde), m.hacia && nombreCuenta(m.hacia), m.fijo && fijo(m.fijo) && fijo(m.fijo).nombre].filter(Boolean).join(" "); }

}
function presentarMov(m) {

  else if (m.tipo === "ingreso") { v = m.valor; cls = "pos"; ico = ICON.entra; icls = "in"; l2 = (m.cat || "Ingreso") + " · a " + nombreCuenta(m.hacia); }
  else if (m.tipo === "traslado") { v = m.valor; l2 = nombreCuenta(m.desde) + " → " + nombreCuenta(m.hacia); }
  else { v = m.hacia ? m.valor : -m.valor; ico = ICON.ajuste; l2 = CAT_AJUSTE + " · " + nombreCuenta(m.hacia || m.desde); }
  if (c) { v = efecto(m, c); cls = v > 0 ? "pos" : ""; }
  const titulo = m.nota || (m.fijo && fijo(m.fijo) ? fijo(m.fijo).nombre : m.cat) || (m.tipo === "traslado" ? "Traslado" : "Movimiento");

let toastT = null, toastFn = null;
function toast(texto, deshacer) {

function chip(k, v, txt, sel, extra) { return '<button class="chip' + (sel ? " on" : "") + '" data-act="rg-set" data-k="' + k + '" data-v="' + esc(v) + '"' + (extra || "") + ">" + txt + "</button>"; }

function leerForm() {

function msgForm(t, err) { const p = $("#rg-msg"); if (!p) return; p.hidden = !t; p.textContent = t || ""; p.classList.toggle("err", !!err); }
function guardarRegistro() {
  leerForm();
  const e = validarMov(F);
  if (e) { msgForm(e, true); return; }
  const raro = F.modo === "ajuste" ? null : montoRaro(F.valor, F.modo, F.modo === "traslado" ? null : F.cat);
  if (raro && !F.confirmado) { F.confirmado = true; msgForm(raro, false); $("#rg-guardar").textContent = "Sí, guardar " + fmt(F.valor); return; }
  const nuevo = !F.id, plant = !!($("#rg-plant") && $("#rg-plant").checked);
  const r = aplicarMov(F);
  if (F.modo === "gasto") DB.aj.ultimaCuenta = F.desde; else if (F.modo === "ingreso") DB.aj.ultimaCuenta = F.hacia; else if (F.modo === "traslado" && cuenta(F.desde) && cuenta(F.desde).clase === "tengo") DB.aj.ultimaCuenta = F.desde;
  if (plant && nuevo) DB.plantillas.push({ id: nid("p"), nombre: (F.nota || "").trim() || (F.modo === "traslado" ? nombreCuenta(F.desde) + " → " + nombreCuenta(F.hacia) : F.cat), tipo: F.modo, valor: F.valor, cat: F.cat, desde: F.modo === "ingreso" ? null : F.desde, hacia: F.modo === "gasto" ? null : F.hacia, fijo: F.fijo });
  const tocadas = [r.mov.desde, r.mov.hacia, r.antes && r.antes.desde, r.antes && r.antes.hacia];
  const cambios = revisarArchivo(tocadas, r.mov.tipo === "traslado" ? r.mov.hacia : null);
  guardarDB("movs", "aj", "plantillas", "cuentas");
  pedirPersistencia();

    if (r.antes) Object.assign(DB.movs.find((m) => m.id === r.mov.id), r.antes); else DB.movs = DB.movs.filter((m) => m.id !== r.mov.id);
    revisarArchivo(tocadas, null); guardarDB("movs", "cuentas"); render(); toast("Deshecho");

// Deudas y «me deben»: la que llega a cero con un pago queda archivada (sale de las listas, conserva su historia);
// la archivada que vuelve a tener saldo (una compra con la tarjeta, un cambio, un borrado) vuelve a las listas.
function revisarArchivo(ids, porPago) {
  const cambios = [];
  for (const id of new Set(ids.filter(Boolean))) {
    const c = cuenta(id); if (!c || c.clase === "tengo") continue;
    const s = saldo(id);
    if (s === 0 && !c.archivada && porPago === id) { c.archivada = true; cambios.push(c.nombre + " quedó saldada"); }
    else if (s !== 0 && c.archivada) { c.archivada = false; cambios.push(c.nombre + " volvió a las listas"); }
  }
  return cambios;
}
function borrarRegistro() {
  const m = DB.movs.find((x) => x.id === F.id); if (!m) return;
  m.borrado = true; m.editado = ahora().getTime();
  const cambios = revisarArchivo([m.desde, m.hacia], null);
  guardarDB("movs", "cuentas"); cerrarSheet(); render();
  toast("Movimiento borrado" + (cambios.length ? " · " + cambios.join(" · ") : ""), () => { m.borrado = false; m.editado = ahora().getTime(); revisarArchivo([m.desde, m.hacia], m.tipo === "traslado" ? m.hacia : null); guardarDB("movs", "cuentas"); render(); toast("Recuperado"); });
}

  if (!l.length && !ds.length) { toast("Primero agrega tus cuentas en Ajustes."); return; }
  let h = "<p>Abre la app de tu banco y mira lo que tienes en la mano. Escribe el saldo real de hoy; si una cuenta está en negativo, empieza con el signo menos (−). Al Día registra la diferencia como «Ajuste de cuadre», a la vista. Lo que dejes en blanco no se toca.</p>";
  h += l.map((c) => '<div class="cq"><div class="cq-top"><b>' + esc(c.nombre) + "</b><small>Al Día dice " + mon(S[c.id]) + '</small></div><div class="monto sm"><span>$</span><input data-cq="' + c.id + '" inputmode="text" autocomplete="off" placeholder="Saldo real de hoy" aria-label="Saldo real de ' + esc(c.nombre) + '"></div><small class="cq-dif" id="cqd-' + c.id + '"></small></div>').join("");
  if (ds.length) {
    h += '<h3 class="cq-h">Tus deudas</h3><p class="mu cq-p">Una vez al mes, después de pagar las cuotas, escribe lo que el banco dice que debes hoy (saldo pendiente). Al Día resta cada cuota completa, pero el banco solo baja el capital: lo que debas de más son intereses y seguros, y queda en «Intereses y comisiones».</p>';
    h += ds.map((c) => '<div class="cq"><div class="cq-top"><b>' + esc(c.nombre) + "</b><small>Al Día dice que debes " + mon(-S[c.id]) + '</small></div><div class="monto sm"><span>$</span><input data-cqd="' + c.id + '" inputmode="decimal" autocomplete="off" placeholder="Saldo pendiente en el banco" aria-label="Saldo pendiente de ' + esc(c.nombre) + '"></div><small class="cq-dif" id="cqdd-' + c.id + '"></small></div>').join("");

function leerReal(input) { const v = input.value.trim(); if (!v) return null; const n = parseMonto(v); if (!Number.isFinite(n)) return NaN; return /^[-−]/.test(v) ? -n : n; }
function difCuadre(input) {
  const id = input.dataset.cq, real = leerReal(input), out = $("#cqd-" + id);
  if (real == null) { out.textContent = ""; return; }
  if (!Number.isFinite(real)) { out.textContent = "Escribe solo el número."; return; }
  const d = real - saldo(id);
  out.innerHTML = d === 0 ? "Igual: no hay diferencia." : "Diferencia: " + mon(d, d > 0 ? "pos" : "neg").replace(fmt(d), fmt(d, true)) + (d > 0 ? " · entró algo que no se registró" : " · salió algo que no se registró");
}
function difDeuda(input) {
  const id = input.dataset.cqd, debe = leerReal(input), out = $("#cqdd-" + id);
  if (debe == null) { out.textContent = ""; return; }
  if (!Number.isFinite(debe) || debe < 0) { out.textContent = "Escribe solo el número, sin signo."; return; }
  const d = debe + saldo(id); // > 0: el banco dice que debes más que Al Día
  out.innerHTML = d === 0 ? "Igual: no hay diferencia." : d > 0 ? "Debes " + mon(d, "neg") + " más · intereses y seguros" : "Debes " + mon(-d, "pos") + " menos · queda como ajuste";
}
function guardarCuadre() {
  const reales = {}, deudas = {}; let malos = 0;
  $$("[data-cq]").forEach((i) => { const r = leerReal(i); if (r == null) return; if (!Number.isFinite(r)) malos++; else reales[i.dataset.cq] = r; });
  $$("[data-cqd]").forEach((i) => { const r = leerReal(i); if (r == null) return; if (!Number.isFinite(r) || r < 0) malos++; else deudas[i.dataset.cqd] = r; });
  const p = $("#cq-msg");
  if (malos) { p.hidden = false; p.className = "msg err"; p.textContent = "Revisa los montos: escribe solo números."; return; }
  if (!Object.keys(reales).length && !Object.keys(deudas).length) { p.hidden = false; p.className = "msg err"; p.textContent = "Escribe el saldo real de al menos una cuenta o deuda."; return; }
  const r = cuadrar(reales, deudas);
  guardarDB("movs", "aj"); cerrarSheet(); render();
  const n = Object.keys(reales).length, m = Object.keys(deudas).length, partes = [];
  if (n) partes.push(n === 1 ? "1 cuenta" : n + " cuentas");
  if (m) partes.push(m === 1 ? "1 deuda" : m + " deudas");
  const nA = r.creados.filter((x) => x.tipo === "ajuste").length, nI = r.creados.length - nA;
  const detalle = r.creados.length ? (nA ? " · " + nA + (nA === 1 ? " ajuste" : " ajustes") : "") + (nI ? " · intereses en " + nI + (nI === 1 ? " deuda" : " deudas") : "") : " · sin diferencias";
  toast(partes.join(" y ") + (n + m === 1 ? " cuadrada" : " cuadradas") + detalle, () => {
    const ids = new Set(r.creados.map((m) => m.id)); DB.movs = DB.movs.filter((m) => !ids.has(m.id)); DB.aj.cuadres = r.cuadresAntes; guardarDB("movs", "aj"); render(); toast("Deshecho");
  });
}

/* ---------- Respaldo (archivo) ---------- */
function nombreRespaldo() { return "respaldo-aldia-" + hoy() + ".json"; }
function marcarRespaldo() { store.set(K.respaldo, { fecha: hoy(), ts: ahora().getTime() }); }
function blobRespaldo() { return new Blob([JSON.stringify(respaldoObj())], { type: "application/json" }); }
function descargar() {
  const a = document.createElement("a"); a.href = URL.createObjectURL(blobRespaldo()); a.download = nombreRespaldo();
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  marcarRespaldo(); render(); toast("Respaldo guardado en Descargas");
}
async function compartirRespaldo() {
  const file = typeof File === "function" ? new File([blobRespaldo()], nombreRespaldo(), { type: "application/json" }) : null;
  if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: "Respaldo de Al Día", text: "Respaldo de Al Día del " + hoy() }); marcarRespaldo(); render(); toast("Respaldo compartido"); }
    catch (e) { if (e && e.name !== "AbortError") descargar(); }
  } else descargar();
}
function abrirRestaurar(texto) {
  const r = leerRespaldo(texto);
  if (r.error) { toast(r.error); return; }
  const n = resumenDB(r.db), dif = DB.cuentas.length ? compararRespaldo(DB, r.db) : [];
  let h = "<p>El archivo trae <b>" + n.movs + " movimientos</b> y <b>" + n.cuentas + " cuentas</b>" + (n.desde ? ", del " + fechaCorta(n.desde) + " al " + fechaCorta(n.hasta) : "") + ".</p>" + (r.nota ? '<p class="mu">' + esc(r.nota) + "</p>" : "");
  if (r.fuera) h += '<p class="msg">' + r.fuera + " datos del archivo estaban dañados y no se cargan.</p>";
  if (DB.cuentas.length) h += '<p class="msg' + (dif.length ? " err" : "") + '">Lo que hay ahora en este celular se reemplaza por el archivo.' + (dif.length ? " " + dif.join(" ") : "") + " Si te equivocas, podrás deshacerlo.</p>";
  h += '<div class="btns"><button class="bt full" data-act="restaurar-ok">' + (DB.cuentas.length ? "Reemplazar con el archivo" : "Cargar") + '</button></div><div class="btns"><button class="bt full ghost" data-act="cerrar">Cancelar</button></div>';
  PEND_RESTAURAR = r.db;
  abrirSheet(DB.cuentas.length ? "Restaurar respaldo" : "Cargar tu historia", h, () => { PEND_RESTAURAR = null; });
}
let PEND_RESTAURAR = null;
function confirmarRestaurar() {
  if (!PEND_RESTAURAR) return;
  const habia = DB.cuentas.length > 0, nuevo = PEND_RESTAURAR;
  PEND_RESTAURAR = null;
  aplicarRespaldo(nuevo); pedirPersistencia(); cerrarSheet(); render();
  store.set(K.bienvenida, true); if ($("#bienv") && !$("#bienv").hidden) cerrarBienvenida(true);
  const n = resumenDB(DB);
  toast((habia ? "Restaurado: " : "Cargado: ") + n.movs + " movimientos", () => { deshacerRestaurar(); render(); toast("Volviste a como estabas"); });
}
function leerArchivo(input) {
  const f = input.files && input.files[0]; if (!f) return;
  if (f.size > 15 * 1024 * 1024) { toast("El archivo es demasiado grande para ser un respaldo de Al Día."); input.value = ""; return; }
  const rd = new FileReader();
  rd.onload = () => { input.value = ""; abrirRestaurar(String(rd.result || "")); };
  rd.onerror = () => { input.value = ""; toast("No se pudo leer el archivo."); };
  rd.readAsText(f);
}
let pidioPersistencia = false;
function pedirPersistencia() {
  if (pidioPersistencia || !navigator.storage || !navigator.storage.persist) return;
  pidioPersistencia = true;
  navigator.storage.persisted().then((p) => p || navigator.storage.persist()).catch(() => {});
}

  ajustes: ["Ajustes", "<h3>Cuentas</h3><p>Tus bancos, billeteras y efectivo (lo que tienes), tus tarjetas y créditos (lo que debes) y las personas que te deben. A las deudas ponles cuota y día de pago para que salgan en Pagos del mes.</p><h3>Gastos fijos</h3><p>Arriendo, recibos, internet… con su monto y su día.</p><h3>Respaldo</h3><p>Tus datos viven solo en este celular. «Compartir respaldo» te deja guardar una copia en tu Drive, tu correo o un chat contigo mismo. Para recuperarlos, «Restaurar desde un archivo».</p><h3>Privacidad</h3><p>El ojo de arriba oculta los montos, para abrir la app en público.</p>"],
};
function abrirAyuda(tab) { const a = AYUDA[tab] || AYUDA.inicio; abrirSheet("¿Cómo funciona? · " + a[0], '<div class="ayuda">' + a[1] + '</div><div class="btns"><button class="bt full ghost" data-act="recorrido">Ver el recorrido completo</button></div>'); }

/* ---------- Bienvenida ---------- */
function abrirBienvenida(paso) {
  const el = $("#bienv");
  const top = '<div class="bv-top">' + (paso === 1 ? '<button class="enlace" data-act="bv-cerrar">Omitir</button>' : "") + "</div>";
  let mid, bt;
  if (paso === 1) { mid = LOGO + "<h1>Bienvenido a Al Día</h1><p>Tus cuentas, tus deudas y tus pagos, al día. Todo se guarda en este celular, sin cuentas ni contraseñas.</p>"; bt = '<button class="bt full" data-act="bv-paso" data-arg="2">Empezar</button>'; }
  else { mid = "<h1>Tu historia</h1><p>Si tienes tu archivo de historia (carga-inicial.json) o un respaldo de Al Día, cárgalo y tendrás todo desde enero: saldos, deudas y gastos fijos.</p>"; bt = '<span class="bt full archivo">Cargar mi historia<input type="file" accept=".json,application/json" data-cargar="1" aria-label="Cargar mi historia"></span><button class="bt full ghost" data-act="bv-cero">Empezar desde cero</button>'; }
  el.innerHTML = '<div class="bv">' + top + '<div class="bv-mid">' + mid + '</div><div class="bv-bt">' + bt + "</div></div>";
  el.hidden = false;
}
function cerrarBienvenida(ofrecerRecorrido) {
  store.set(K.bienvenida, true); $("#bienv").hidden = true; render();
  if (ofrecerRecorrido && !store.get(K.recorrido, false)) setTimeout(() => iniciarRecorrido(), 400);
}

/* ---------- Recorrido guiado ---------- */
const PASOS = [
  { tab: "inicio", sel: "#c-tengo", t: "Lo que tienes", x: "Tus cuentas y su saldo según lo que registras. Toca una para ver solo sus movimientos." },
  { tab: "inicio", sel: "#c-debo", t: "Lo que debes y te deben", x: "El total de tus deudas y de lo que te deben. Tócalo para ver el detalle." },
  { tab: "inicio", sel: "#c-prox", t: "Próximos pagos", x: "Lo que vence en los próximos 7 días y lo vencido. «Pagar» te deja el movimiento listo." },
  { tab: "inicio", sel: "#b-cuadrar", t: "Cuadrar con el banco", x: "Escribe el saldo real de tu banco y Al Día registra la diferencia, a la vista. Hazlo cada semana." },
  { sel: ".fab", t: "Registrar", x: "Gasto, ingreso o pago: monto, categoría y cuenta. Tres toques." },
  { sel: '.nb[data-arg="movs"]', t: "Movimientos", x: "Todo lo registrado, por mes. Busca, filtra y toca uno para corregirlo o borrarlo." },
  { sel: '.nb[data-arg="pagos"]', t: "Pagos del mes", x: "Tus gastos fijos y las cuotas de tus deudas: pagado, pendiente o vencido." },
  { sel: '.nb[data-arg="deudas"]', t: "Deudas", x: "Cuánto debes en cada una, cuánto llevas pagado y cuánto te falta." },
  { sel: "#b-ojo", t: "Ocultar montos", x: "Para abrir la app en público sin mostrar tus números." },
  { sel: "#b-ayuda", t: "¿Cómo funciona?", x: "Te explica la pantalla en la que estás. Este recorrido se repite desde Ajustes › Guía." },
];
let PASO = 0;
function iniciarRecorrido() { cerrarSheetSiAbierta(); if (!DB.cuentas.length) { toast("El recorrido se ve mejor con tus cuentas cargadas."); return; } PASO = 0; $("#tour").hidden = false; mostrarPaso(); }
function cerrarSheetSiAbierta() { if (!$("#sheet").hidden) cerrarSheet(); }
function mostrarPaso() {
  const p = PASOS[PASO], tour = $("#tour");
  if (p.tab && TAB !== p.tab) irA(p.tab);
  const el = $(p.sel);
  if (!el) { if (PASO < PASOS.length - 1) { PASO++; mostrarPaso(); } else terminarRecorrido(); return; }
  const fijoAbajo = !!el.closest("nav.tabs"), fijoArriba = !!el.closest(".top");
  if (!fijoAbajo && !fijoArriba) {
    el.scrollIntoView({ block: "center" });
    const r0 = el.getBoundingClientRect();
    if (r0.height > innerHeight * 0.45) window.scrollBy(0, r0.top - 72); // muy alto: que empiece arriba, bajo la barra
  }
  requestAnimationFrame(() => {
    tour.innerHTML = '<div class="spot"></div><div class="tcard"><p class="paso">Paso ' + (PASO + 1) + " de " + PASOS.length + "</p><h2>" + p.t + "</h2><p>" + p.x + '</p><div class="tbt"><button class="bt sm ghost" data-act="tour-atras"' + (PASO ? "" : " disabled") + '>Atrás</button><button class="bt sm" data-act="tour-sig">' + (PASO === PASOS.length - 1 ? "Listo" : "Siguiente") + '</button></div><button class="enlace" data-act="tour-fin">Saltar el recorrido</button></div>';
    const spot = $(".spot", tour), card = $(".tcard", tour), H = innerHeight, m = 6, cardH = card.offsetHeight;
    let r = el.getBoundingClientRect();
    // Si el elemento y la tarjeta caben juntos pero no tal como quedó la pantalla, se desplaza para que el elemento
    // empiece bajo la barra de arriba y la tarjeta quepa debajo.
    if (!fijoAbajo && !fijoArriba && H - r.bottom - m - 12 < cardH && r.top - m - 12 < cardH && r.height + cardH + 2 * m + 36 <= H - 64) { window.scrollBy(0, r.top - 72); r = el.getBoundingClientRect(); }
    let arriba = r.top - m, abajo = r.bottom + m, cardTop;
    if (H - abajo - 12 >= cardH) cardTop = abajo + 12;            // cabe debajo
    else if (arriba - 12 >= cardH) cardTop = arriba - 12 - cardH;  // cabe encima
    else {                                                         // no cabe: el recuadro se recorta a lo visible y la tarjeta va abajo
      cardTop = H - cardH - 12; arriba = Math.max(arriba, 8); abajo = Math.min(abajo, cardTop - 12);
    }
    Object.assign(spot.style, { left: r.left - m + "px", top: arriba + "px", width: r.width + 2 * m + "px", height: Math.max(0, abajo - arriba) + "px" });
    Object.assign(card.style, { top: Math.max(8, Math.min(cardTop, H - cardH - 8)) + "px", bottom: "auto" });
  });
}
function terminarRecorrido() { $("#tour").hidden = true; $("#tour").innerHTML = ""; store.set(K.recorrido, true); irA("inicio"); }

/* ---------- Acciones (un solo escuchador para todos los botones) ---------- */
const ACT = {
  ir: (b) => { cerrarSheetSiAbierta(); irA(b.dataset.arg); if (b.dataset.ancla) setTimeout(() => { const a = $("#" + b.dataset.ancla); if (a) a.scrollIntoView({ block: "start" }); }, 30); },
  registrar: () => abrirRegistro(),
  cerrar: () => cerrarSheet(),
  ocultar: () => { DB.aj.ocultar = !DB.aj.ocultar; guardarDB("aj"); render(); },
  ayuda: () => abrirAyuda(TAB),
  "ayuda-de": (b) => abrirAyuda(b.dataset.arg),
  "ocultar-aviso": (b) => { const h = hoy(), oc = store.get(K.avisos, {}); const ids = oc && oc.fecha === h && Array.isArray(oc.ids) ? oc.ids : []; store.set(K.avisos, { fecha: h, ids: [...new Set([...ids, b.dataset.arg])] }); render(); },
  "ver-cuenta": (b) => { UI.filtroCuenta = b.dataset.arg; UI.filtroTipo = ""; UI.buscar = ""; UI.abiertos = {}; irA("movs"); },
  "limpiar-filtros": () => { UI.filtroCuenta = ""; UI.filtroTipo = ""; UI.buscar = ""; render(); },
  editar: (b) => { const m = DB.movs.find((x) => x.id === b.dataset.arg); if (m) abrirRegistro({ id: m.id, modo: m.tipo, valor: m.valor, cat: m.cat, fijo: m.fijo, desde: m.desde, hacia: m.hacia, fecha: m.fecha, nota: m.nota }); },
  pagar: (b) => {
    const [clase, id] = b.dataset.arg.split(":"), o = [...obligaciones(), ...obligaciones(UI.mesPagos || ymDe(hoy()))].find((x) => x.clase === clase && x.id === id);
    if (clase === "fijo") { const f = fijo(id); if (!f) return; abrirRegistro({ modo: "gasto", cat: CAT_FIJOS, fijo: id, valor: o ? pendienteDe(o) || f.monto || null : f.monto || null, desde: f.cuenta && cuenta(f.cuenta) ? f.cuenta : undefined, nota: f.nombre }); }
    else { const c = cuenta(id); if (!c) return; const desde = cuenta(DB.aj.ultimaCuenta) && cuenta(DB.aj.ultimaCuenta).clase === "tengo" ? DB.aj.ultimaCuenta : (activas("tengo")[0] || {}).id; abrirRegistro({ modo: "traslado", hacia: id, desde, valor: c.cuota ? (o ? pendienteDe(o) : c.cuota) || c.cuota : null, nota: "Abono " + c.nombre }); }
  },
  cobrar: (b) => { const c = cuenta(b.dataset.arg); if (!c) return; abrirRegistro({ modo: "traslado", desde: c.id, hacia: (activas("tengo")[0] || {}).id, nota: "Devolución de " + c.nombre }); },
  "rg-modo": (b) => { leerForm(); F.modo = b.dataset.arg; F.cat = null; F.fijo = null; F.confirmado = false; if (F.modo === "ingreso") { F.hacia = cuenta(F.desde) && cuenta(F.desde).clase === "tengo" ? F.desde : (activas("tengo")[0] || {}).id; F.desde = null; } else if (F.modo === "gasto") { F.desde = F.desde || F.hacia; F.hacia = null; } else { F.desde = F.desde || (activas("tengo")[0] || {}).id; } $$(".seg button").forEach((x) => x.classList.toggle("on", x === b)); msgForm(""); $("#rg-guardar").textContent = "Guardar"; pintarCampos(); },
  "rg-set": (b) => { F[b.dataset.k] = b.dataset.v; if (b.dataset.k === "cat" && b.dataset.v !== CAT_FIJOS) F.fijo = null; if (b.dataset.k === "fijo") { const f = fijo(b.dataset.v); if (f && !parseMonto($("#rg-valor").value) && f.monto) $("#rg-valor").value = enCampo(f.monto); } F.confirmado = false; $("#rg-guardar").textContent = "Guardar"; msgForm(""); pintarCampos(); },
  "rg-todas": () => { UI.verTodasCats = true; pintarCampos(); },
  "rg-plantilla": (b) => { const p = DB.plantillas.find((x) => x.id === b.dataset.arg); if (!p) return; leerForm(); Object.assign(F, { modo: p.tipo, cat: p.cat, fijo: p.fijo, desde: p.desde || F.desde, hacia: p.hacia || null, nota: F.nota || p.nombre, confirmado: false }); if (p.valor) $("#rg-valor").value = enCampo(p.valor); $("#rg-nota").value = F.nota; $$(".seg button").forEach((x) => x.classList.toggle("on", x.dataset.arg === F.modo)); pintarCampos(); },
  "rg-guardar": () => guardarRegistro(),
  "rg-borrar": () => borrarRegistro(),
  "toast-deshacer": () => { const f = toastFn; $("#toast").hidden = true; toastFn = null; if (f) f(); },
  cuadrar: () => abrirCuadre(),
  "cq-guardar": () => guardarCuadre(),
  "mes-pagos": (b) => { UI.mesPagos = sumarMes(UI.mesPagos || ymDe(hoy()), Number(b.dataset.arg)); render(); },
  cuenta: (b) => abrirCuenta(b.dataset.arg || null, b.dataset.clase),
  "ce-clase": (b) => { if (!CE || b.disabled) return; const e = leerCuentaParcial(); CE.clase = b.dataset.arg; CE.tipo = TIPOS[CE.clase][0][0]; CE.saldoInicial = e; $$("#ce-clase .chip").forEach((x) => x.classList.toggle("on", x === b)); pintarCuenta(); },
  "ce-tipo": (b) => { if (!CE) return; CE.saldoInicial = leerCuentaParcial(); CE.tipo = b.dataset.arg; pintarCuenta(); },
  "ce-guardar": () => guardarCuenta(),
  "ce-borrar": () => borrarCuenta(),
  fijo: (b) => abrirFijo(b.dataset.arg || null),
  "fe-cuenta": (b) => { FE.cuenta = b.dataset.arg; $$('[data-act="fe-cuenta"]').forEach((x) => x.classList.toggle("on", x === b)); },
  "fe-guardar": () => guardarFijo(),
  "fe-borrar": () => borrarFijo(),
  "cat-agregar": (b) => { const t = b.dataset.arg, i = $("#cat-nueva-" + t), v = i.value.trim(); if (!v) return; if (v === CAT_AJUSTE || DB.cats[t].some((c) => c.toLowerCase() === v.toLowerCase())) { toast("Esa categoría ya existe."); return; } DB.cats[t].push(v); guardarDB("cats"); render(); toast("Categoría agregada"); },
  "cat-quitar": (b) => { const t = b.dataset.arg, v = b.dataset.v; if (DB.movs.some((m) => m.cat === v)) return; const antes = clon(DB.cats); DB.cats[t] = DB.cats[t].filter((c) => c !== v); guardarDB("cats"); render(); toast("Categoría quitada", () => { DB.cats = antes; guardarDB("cats"); render(); }); },
  tema: (b) => { DB.aj.tema = b.dataset.arg; guardarDB("aj"); render(); },
  "respaldo-compartir": () => compartirRespaldo(),
  "respaldo-archivo": () => descargar(),
  "restaurar-ok": () => confirmarRestaurar(),
  "deshacer-restaurar": () => { if (deshacerRestaurar()) { render(); toast("Volviste a como estabas antes de restaurar"); } },
  recorrido: () => { cerrarSheetSiAbierta(); iniciarRecorrido(); },
  bienvenida: () => abrirBienvenida(1),
  "bv-paso": (b) => abrirBienvenida(Number(b.dataset.arg)),
  "bv-cerrar": () => cerrarBienvenida(false),
  "bv-cero": () => { cerrarBienvenida(false); irA("inicio"); abrirCuenta(null, "tengo"); },
  "tour-sig": () => { if (PASO >= PASOS.length - 1) terminarRecorrido(); else { PASO++; mostrarPaso(); } },
  "tour-atras": () => { if (PASO > 0) { PASO--; mostrarPaso(); } },
  "tour-fin": () => terminarRecorrido(),
  actualizar: () => location.reload(),
};
function leerCuentaParcial() { const i = $("#ce-saldo"); const s = i ? parseMonto(i.value || "0") : 0; const v = Number.isFinite(s) ? s : 0; const n = $("#ce-nombre"); if (n) CE.nombre = n.value; return CE.clase === "debo" ? -v : v; }

/* ---------- Arranque ---------- */
function registrarSW() {
  if (!("serviceWorker" in navigator) || !(location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) return;
  const habia = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js").then((reg) => { setInterval(() => reg.update().catch(() => {}), 60 * 60 * 1000); }).catch(() => {});
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (habia) $("#upd").hidden = false; });
}
function iniciar() {
  $$(".nb").forEach((b) => (b.innerHTML = ICON[b.dataset.arg] + "<span>" + NOMBRE_TAB[b.dataset.arg] + "</span>"));
  $(".fab").innerHTML = ICON.mas; $("#b-ayuda").innerHTML = ICON.ayuda; $("#b-ajustes").innerHTML = ICON.ajustes;
  const danados = cargarDB();
  document.addEventListener("click", (e) => { const b = e.target.closest("[data-act]"); if (!b || b.disabled) return; const f = ACT[b.dataset.act]; if (f) { e.preventDefault(); f(b); } });
  document.addEventListener("input", (e) => {
    const t = e.target;
    if (t.id === "rg-valor" || t.id === "ce-saldo" || t.id === "ce-cuota" || t.id === "fe-monto") { t.value = formatoVivo(t.value); if (t.id === "rg-valor" && F) { F.confirmado = false; msgForm(""); $("#rg-guardar").textContent = "Guardar"; } }
    else if (t.dataset && t.dataset.cq) { const neg = /^\s*[-−]/.test(t.value); t.value = (neg ? "−" : "") + formatoVivo(t.value); difCuadre(t); }
    else if (t.dataset && t.dataset.cqd) { t.value = formatoVivo(t.value); difDeuda(t); }
    else if (t.id === "mv-buscar") { UI.buscar = t.value; UI.abiertos = {}; pintarListaMovs(); }
  });
  document.addEventListener("change", (e) => {
    const t = e.target;
    if (t.id === "mv-cuenta") { UI.filtroCuenta = t.value; UI.abiertos = {}; pintarListaMovs(); }
    else if (t.id === "mv-tipo") { UI.filtroTipo = t.value; UI.abiertos = {}; pintarListaMovs(); }
    else if (t.id === "aj-ocultar") { DB.aj.ocultar = t.checked; guardarDB("aj"); render(); }
    else if (t.dataset && t.dataset.cargar) leerArchivo(t);
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") { if (!$("#tour").hidden) terminarRecorrido(); else if (!$("#sheet").hidden) cerrarSheet(); } if (e.key === "Enter" && e.target && e.target.id === "rg-valor") { e.preventDefault(); e.target.blur(); } });
  // Otra pestaña o ventana cambió los datos: se recargan para no pisarlos.
  window.addEventListener("storage", (e) => { if (e.key && e.key.indexOf("aldia.") === 0) { cargarDB(); if ($("#sheet").hidden) render(); } });
  // La app instalada puede quedar abierta de un día para otro: al volver se repinta con la fecha nueva.
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && $("#sheet").hidden && $("#tour").hidden) render(); });
  render();
  if (danados) toast(danados + " datos guardados estaban dañados y se omitieron (hay una copia de seguridad interna).");
  if (!DB.cuentas.length && !store.get(K.bienvenida, false)) abrirBienvenida(1);
  registrarSW();
}
if (EN_NAVEGADOR) iniciar();
</script>
